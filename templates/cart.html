<!DOCTYPE html>
<html>

<head>

    <title>Cart</title>
    <link rel="icon" href="{{ url_for('static', filename='css/images/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-info-subtle">

    <nav class="navbar navbar-dark bg-dark px-4">

        <a class="navbar-brand d-flex align-items-center text-white">
            <img src="{{ url_for('static', filename='css/images/logo.png') }}" alt="Zentro Logo" width="45" height="45"
                class="me-2">

            <span class="fw-bold">
                ZENTRO
            </span>
        </a>

        <div>

            <a href="/dashboard" class="btn btn-light">
                Dashboard
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </nav>

    <div class="container py-5">

        <h1 class="mb-5">
            Shopping Cart
        </h1>

        <div class="row">

            {% for item in cart_items %}

            <div class="col-md-4 mb-4">

                <div class="card shadow h-100">

                    <img src="{{ item[4] }}" class="card-img-top" style="height:250px;object-fit:cover">

                    <div class="card-body">

                        <h3>{{ item[2] }}</h3>

                        <h4 class="text-success">
                            ₹{{ item[3] }}
                        </h4>

                        <h5>
                            Quantity: {{ item[5] }}
                        </h5>

                        <div class="mt-3">

                            <a href="/increase-quantity/{{ item[0] }}" class="btn btn-success">
                                +
                            </a>

                            <a href="/decrease-quantity/{{ item[0] }}" class="btn btn-warning">
                                -
                            </a>

                            <a href="/remove-cart/{{ item[0] }}" class="btn btn-danger">
                                Remove
                            </a>

                        </div>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

        <div class="card p-4 shadow mt-4">

            <h2>
                Total Price:
                <span class="text-success">
                    ₹{{ total }}
                </span>
            </h2>

            <a href="/payment" class="btn btn-success btn-lg mt-3">
                Proceed To Checkout
            </a>




        </div>

    </div>

</body>

</html>
