
<!DOCTYPE html>
<html>

<head>

    <title>Product Details</title>
    <link rel="icon"
      href="{{ url_for('static', filename='css/images/favicon.png') }}">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">

       <a class="navbar-brand d-flex align-items-center text-white">
    <img
        src="{{ url_for('static', filename='css/images/logo.png') }}"
        alt="Zentro Logo"
        width="45"
        height="45"
        class="me-2"
    >

    <span class="fw-bold">
        ZENTRO
    </span>
</a> 

        <div>

            <a href="/wishlist" class="btn btn-danger">
                Wishlist
            </a>

            <a href="/cart" class="btn btn-warning">
                Cart
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </nav>

    <div class="container py-5">

        <div class="row">

            <div class="col-md-6">

                <img
                  src="{{ product[4] }}"
                  class="img-fluid rounded shadow"
                  style="height:500px;object-fit:cover;width:100%;"
                >

            </div>

            <div class="col-md-6">

                <h1 class="mb-4">
                    {{ product[1] }}
                </h1>

                <!-- CATEGORY -->

                <h4 class="text-primary mb-3">
                    Category: {{ product[3] }}
                </h4>

                <h2 class="text-success mb-4">
                    ₹{{ product[2] }}
                </h2>

                <p class="fs-5">
                    Premium quality electronic product with latest features and high performance.
                </p>

                <div class="mt-5">

                    <!-- ADD TO CART -->

                    <a
                      href="/add-to-cart/{{ product[0] }}"
                      class="btn btn-success btn-lg"
                    >
                        Add To Cart
                    </a>

                    <!-- BUY NOW -->

                    <a
                      href="/buy-now/{{ product[0] }}"
                      class="btn btn-primary btn-lg ms-3"
                    >
                        Buy Now
                    </a>

                    <!-- WISHLIST -->

                    <a
                      href="/add-wishlist/{{ product[0] }}"
                      class="btn btn-danger btn-lg ms-3"
                    >
                        ❤️ Wishlist
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
