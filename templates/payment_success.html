
<!DOCTYPE html>
<html>

<head>

    <title>Payment Success</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>

        body{
            background:#b8eeee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .success-card{
            width:600px;
            border-radius:25px;
        }

        .checkmark{
            font-size:100px;
            color:green;
        }

        .success-title{
            font-size:45px;
            font-weight:bold;
            color:#007b80;
        }

        .success-text{
            font-size:22px;
        }

    </style>

</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card p-5 shadow text-center success-card">

        <div class="checkmark">
            ✅
        </div>

        <h1 class="success-title mt-3">
            Payment Successful
        </h1>

        <p class="success-text mt-3">
            Your order has been placed successfully.
        </p>

        <div class="mt-4">

            <a href="/orders" class="btn btn-success btn-lg">
                View Orders
            </a>

            <a href="/dashboard" class="btn btn-primary btn-lg ms-3">
                Continue Shopping
            </a>

        </div>

    </div>

</div>

</body>

</html>
