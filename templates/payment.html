
<!DOCTYPE html>
<html>

<head>

    <title>Payment</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>

        body{
            background:#b8eeee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .payment-card{
            width:600px;
            border-radius:25px;
        }

        .title{
            font-size:40px;
            font-weight:bold;
            color:#007b80;
        }

    </style>

</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-5 payment-card">

        <h1 class="text-center mb-4 title">
            Payment Details
        </h1>

        <form>

            <input
              type="text"
              name="fullname"
              class="form-control mb-3"
              placeholder="Full Name"
              required
            >

            <input
              type="text"
              name="phone"
              class="form-control mb-3"
              placeholder="Phone Number"
              required
            >

            <textarea
              name="address"
              class="form-control mb-3"
              placeholder="Delivery Address"
              rows="4"
              required
            ></textarea>

            <select
              name="payment"
              class="form-control mb-4"
            >

                <option>
                    Cash On Delivery
                </option>

                <option>
                    UPI Payment
                </option>

                <option>
                    Credit Card
                </option>

            </select>

            <button
              type="button"
              id="rzp-button1"
              class="btn btn-success btn-lg w-100"
            >
                Pay Now
            </button>

        </form>

    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

    "key": "rzp_test_SvEyOrRrLvHSxK",

    "amount": "{{ payment.amount }}",

    "currency": "INR",

    "name": "Flask E-Commerce",

    "description": "Product Payment",

    "order_id": "{{ payment.id }}",

    "handler": function (response){

        window.location.href="/place-order";

    }

};

var rzp1 = new Razorpay(options);

document.getElementById('rzp-button1').onclick = function(e){

    rzp1.open();

    e.preventDefault();

}

</script>

</body>

</html>
