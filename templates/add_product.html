<!DOCTYPE html>
<html>

<head>

    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #b8eeee;
            font-family: Arial, Helvetica, sans-serif;
        }

        .product-card {
            width: 500px;
            border-radius: 20px;
        }

        .title {
            font-size: 40px;
            font-weight: bold;
            color: #007b80;
        }

        .btn-add {
            background: #28a745;
            color: white;
            font-size: 20px;
            border: none;
        }

        .btn-add:hover {
            background: #1e7e34;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="card p-5 shadow product-card">

            <h1 class="text-center mb-4 title">
                Add Product
            </h1>

            <form method="POST" action="/insert-product">

                <input type="text" name="name" class="form-control mb-3" placeholder="Product Name" required>

                <input type="number" name="price" class="form-control mb-3" placeholder="Product Price" required>
                
                <input type="text" name="category" class="form-control mb-3" placeholder="Product Category" required>
                
                <input type="text" name="image" class="form-control mb-4" placeholder="Product Image URL" required>

                <button class="btn btn-add w-100">
                    Add Product
                </button>

            </form>

            <a href="/admin-dashboard" class="btn btn-dark mt-3">
                Back
            </a>

        </div>

    </div>

</body>

</html>
