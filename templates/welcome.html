<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZENTRO</title>

    <link rel="icon"
          href="{{ url_for('static', filename='css/images/favicon.png') }}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:linear-gradient(to right,#dff6ff,#c7f9cc);
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Navbar */

        .navbar{
            background:#111827;
            padding:15px 40px;
        }

        .brand-box{
            display:flex;
            align-items:center;
        }

        .brand-name{
            color:white;
            font-size:32px;
            font-weight:bold;
            margin-left:10px;
        }

        /* Main */

        .main-section{

            height:80vh;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            text-align:center;
        }

        .main-title{

            font-size:70px;

            font-weight:bold;

            color:#111827;

            margin-bottom:20px;
        }

        .main-subtitle{

            font-size:28px;

            color:#374151;

            margin-bottom:50px;
        }

        /* Buttons */

        .btn-box{

            display:flex;

            gap:30px;
        }

        .admin-btn{

            background:#ff6b35;

            color:white;

            border:none;

            width:220px;

            height:65px;

            font-size:24px;

            border-radius:10px;
        }

        .admin-btn:hover{

            background:#e85d04;
        }

        .user-btn{

            background:#16a34a;

            color:white;

            border:none;

            width:220px;

            height:65px;

            font-size:24px;

            border-radius:10px;
        }

        .user-btn:hover{

            background:#15803d;
        }

        /* Footer */

        footer{

            background:#111827;

            color:white;

            height:60px;

            display:flex;

            justify-content:center;

            align-items:center;

            position:fixed;

            bottom:0;

            width:100%;
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="brand-box">

            <img
                src="{{ url_for('static', filename='css/images/logo.png') }}"
                width="55"
                height="55"
                alt="Zentro Logo">

            <span class="brand-name">
                ZENTRO
            </span>

        </div>

    </nav>

    <!-- Main Section -->

    <div class="main-section">

        <h1 class="main-title">
            Welcome to ZENTRO
        </h1>

        <p class="main-subtitle">
            Discover Fashion, Electronics, Accessories and More
        </p>

        <div class="btn-box">

            <a href="/admin-login">

                <button class="admin-btn">
                    Admin Login
                </button>

            </a>

            <a href="/">

                <button class="user-btn">
                    User Login
                </button>

            </a>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        © 2026 ZENTRO | Smart Shopping Starts Here

    </footer>

</body>

</html>
