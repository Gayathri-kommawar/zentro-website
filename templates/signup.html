
<!DOCTYPE html>
<html>

<head>

    <title>Zentro</title>

    <link rel="icon"
      href="{{ url_for('static', filename='css/images/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>

        body{
            background:#b8eeee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .signup-card{
            width:450px;
            border-radius:20px;
        }

        .title{
            font-size:40px;
            font-weight:bold;
            color:#007b80;
        }

        .btn-register{
            background:#007bff;
            color:white;
            font-size:20px;
            border:none;
        }

        .btn-register:hover{
            background:#0056b3;
            color:white;
        }

    </style>

</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card p-5 shadow signup-card">

        <h1 class="text-center mb-4 title">
            Create Account
        </h1>

        <form method="POST" action="/register">

            <input
                type="text"
                name="name"
                class="form-control mb-3"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                class="form-control mb-3"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                class="form-control mb-4"
                placeholder="Password"
                required
            >

            <button class="btn btn-register w-100">
                Register
            </button>

        </form>

        <div class="text-center mt-4">

            <a href="/" class="btn btn-dark">
                Back To Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
