
<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{
            background:#b8eeee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .login-card{
            width:450px;
            border-radius:20px;
        }

        .title{
            font-size:40px;
            font-weight:bold;
            color:#007b80;
        }

        .btn-login{
            background:#ff9800;
            color:white;
            font-size:20px;
            border:none;
        }

        .btn-login:hover{
            background:#f57c00;
            color:white;
        }

    </style>

</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card p-5 shadow login-card">

        <h1 class="text-center mb-4 title">
            Admin Login
        </h1>

        <form method="POST" action="/admin-login-user">

            <input
                type="email"
                name="email"
                class="form-control mb-3"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                name="password"
                class="form-control mb-4"
                placeholder="Password"
                required
            >

            <button class="btn btn-login w-100">
                Login
            </button>

        </form>

        <a href="/welcome" class="btn btn-dark mt-3">
            Back
        </a>

    </div>

</div>

</body>

</html>
