
<!DOCTYPE html>
<html>

<head>

    <title>Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>

        body{
            background:#b8eeee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .profile-card{
            width:500px;
            border-radius:25px;
        }

        .profile-icon{
            font-size:90px;
        }

        .title{
            color:#007b80;
            font-size:40px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-5 text-center profile-card">

        <div class="profile-icon">
            👤
        </div>

        <h1 class="title mt-3">
            My Profile
        </h1>

        <hr>

        <h3 class="mt-4">
            Name:
        </h3>

        <h4>
            {{ user[1] }}
        </h4>

        <h3 class="mt-4">
            Email:
        </h3>

        <h4>
            {{ user[2] }}
        </h4>

        <div class="mt-5">

            <a href="/orders" class="btn btn-success btn-lg">
                My Orders
            </a>

            <a href="/dashboard" class="btn btn-primary btn-lg ms-2">
                Dashboard
            </a>

            <a href="/logout" class="btn btn-danger btn-lg ms-2">
                Logout
            </a>

        </div>

    </div>

</div>

</body>

</html>
